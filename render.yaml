services:
  - type: web
    name: black-hat
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: black-hat-db
          property: connectionString
      - key: PORT
        value: 3000
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: black-hat-db
    plan: starter
    databaseName: blackhat
    user: blackhat
