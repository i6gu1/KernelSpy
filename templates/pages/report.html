{{template "layouts/base.html" .}}

{{define "content"}}
<section class="section report-section">
    <div class="container">
        <div class="report-container animate-fade-in-up">
            <h1 class="section-title" data-i18n="reports.title">Download Report</h1>
            
            <div class="report-options">
                <a href="/api/reports/{{.AnalysisID}}/json" class="report-card card" download>
                    <div class="report-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                    </div>
                    <h3>JSON</h3>
                    <p data-i18n="reports.json">Export as JSON</p>
                </a>
                
                <a href="/api/reports/{{.AnalysisID}}/html" class="report-card card" download>
                    <div class="report-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                    </div>
                    <h3>HTML</h3>
                    <p data-i18n="reports.html">Export as HTML</p>
                </a>
            </div>
            
            <div class="report-back">
                <a href="/results/{{.AnalysisID}}" class="btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    Back to Results
                </a>
            </div>
        </div>
    </div>
</section>
{{end}}
