version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://blackhat:blackhat@db:5432/blackhat?sslmode=disable
      - REDIS_URL=redis:6379
      - PORT=3000
      # SAST pipeline tuning (see README):
      - SAST_TOOLS_DIR=/opt/bin
      - CODQL_HOME=/opt/codeql
      - DEPENDENCY_CHECK_HOME=/opt/dependency-check
      - TRIVY_CACHE_DIR=/opt/trivy-cache
      - SAST_TOOL_TIMEOUT_SECONDS=300
      - CODQL_TIMEOUT_SECONDS=600
      - DEPCHECK_TIMEOUT_SECONDS=600
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
      # Persist the vulnerability feeds so first-run downloads don't repeat:
      - trivy_cache:/opt/trivy-cache
      - depcheck_data:/opt/dependency-check/data

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=blackhat
      - POSTGRES_PASSWORD=blackhat
      - POSTGRES_DB=blackhat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  trivy_cache:
  depcheck_data:
